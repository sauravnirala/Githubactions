version: "3.9"

services:

  mysql:
    image: mysql:8

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db

    ports:
      - "3306:3306"

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:

    image: YOUR_DOCKERHUB_USERNAME/employee-app:latest

    container_name: employee-app

    ports:
      - "5000:5000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: employee_db

    depends_on:
      - mysql
