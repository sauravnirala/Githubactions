name: Employee CI/CD

on:

  push:

    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5

      with:
        python-version: "3.12"

    - run: |
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        python -m unittest discover || true

    - name: Build Docker Image
      run: |
        docker build -t employee-app:${{ github.sha }} .

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag Image
      run: |
        docker tag employee-app:${{ github.sha }} \
        ${{ secrets.DOCKER_USERNAME }}/employee-app:latest

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/employee-app:latest
